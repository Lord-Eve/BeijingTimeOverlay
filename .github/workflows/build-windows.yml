name: Build Windows release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out v1.0.0 source
        uses: actions/checkout@v7
        with:
          ref: v1.0.0
          persist-credentials: false

      - name: Verify release commit
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne '6459ddbb38104ca74fa44895996faac93e0f26be') {
            throw "Unexpected v1.0.0 commit: $actual"
          }

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Publish Windows x64 executable
        shell: pwsh
        run: |
          dotnet publish '.\北京时间浮窗.csproj' -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false -o '.\dist\win-x64'
          if ($LASTEXITCODE -ne 0) { throw 'dotnet publish failed' }
          $files = @(Get-ChildItem '.\dist\win-x64' -File)
          if ($files.Count -ne 1 -or $files[0].Name -ne 'BeijingTimeOverlay.exe') {
            throw "Unexpected publish output: $($files.Name -join ', ')"
          }

      - name: Package and checksum
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path '.\release' -Force | Out-Null
          $zip = '.\release\BeijingTimeOverlay-v1.0.0-win-x64.zip'
          Compress-Archive -Path '.\dist\win-x64\BeijingTimeOverlay.exe' -DestinationPath $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  BeijingTimeOverlay-v1.0.0-win-x64.zip" | Set-Content '.\release\BeijingTimeOverlay-v1.0.0-win-x64.zip.sha256' -Encoding ascii

      - name: Upload release files
        uses: actions/upload-artifact@v7
        with:
          name: BeijingTimeOverlay-v1.0.0-win-x64
          path: release/*
          if-no-files-found: error
          retention-days: 7

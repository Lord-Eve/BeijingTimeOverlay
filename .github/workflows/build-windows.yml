name: Build and publish Windows release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify tag and prepare release notes
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^v(?<Version>\d+\.\d+\.\d+)$') {
            throw "Release tag must use vMAJOR.MINOR.PATCH: $tag"
          }

          $tagVersion = $Matches.Version
          [xml]$project = Get-Content '.\北京时间浮窗.csproj' -Raw
          $projectVersion = [string]$project.Project.PropertyGroup.Version
          if ($projectVersion -ne $tagVersion) {
            throw "Tag $tag does not match project version $projectVersion"
          }

          $changelog = Get-Content '.\CHANGELOG.md' -Raw
          $escapedVersion = [regex]::Escape($tagVersion)
          $pattern = "(?ms)^## \[$escapedVersion\][^\r\n]*\r?\n(?<body>.*?)(?=^## \[|^\[[^\]]+\]: |\z)"
          $match = [regex]::Match($changelog, $pattern)
          if (-not $match.Success -or [string]::IsNullOrWhiteSpace($match.Groups['body'].Value)) {
            throw "No release notes found for $tagVersion in CHANGELOG.md"
          }

          $notesPath = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          [IO.File]::WriteAllText($notesPath, $match.Groups['body'].Value.Trim() + "`n", [Text.UTF8Encoding]::new($false))
          [IO.File]::AppendAllText($env:GITHUB_ENV, "RELEASE_NOTES_PATH=$notesPath`n", [Text.UTF8Encoding]::new($false))

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Run layout and position regression tests
        shell: pwsh
        run: |
          dotnet run --project '.\tests\BeijingTimeOverlay.Tests\BeijingTimeOverlay.Tests.csproj' -c Release -p:TreatWarningsAsErrors=true
          if ($LASTEXITCODE -ne 0) { throw 'Regression tests failed' }

      - name: Publish and package Windows x64 executables
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          New-Item -ItemType Directory -Path '.\release' -Force | Out-Null

          # Self-contained runs anywhere; the framework-dependent build is tiny but needs the .NET 8 Desktop Runtime.
          # Use -p:SelfContained rather than --self-contained: newer SDKs ignore "--self-contained false".
          $variants = @(
            @{ Suffix = ''; Properties = @('-p:SelfContained=true', '-p:IncludeNativeLibrariesForSelfExtract=true', '-p:EnableCompressionInSingleFile=true') },
            @{ Suffix = '-requires-dotnet8'; Properties = @('-p:SelfContained=false') }
          )

          $assets = @()
          foreach ($variant in $variants) {
            $distPath = ".\dist\win-x64$($variant.Suffix)"
            dotnet publish '.\北京时间浮窗.csproj' -c Release -r win-x64 -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false @($variant.Properties) -o $distPath
            if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed for win-x64$($variant.Suffix)" }

            $files = @(Get-ChildItem $distPath -File)
            if ($files.Count -ne 1 -or $files[0].Name -ne 'BeijingTimeOverlay.exe') {
              throw "Unexpected publish output for win-x64$($variant.Suffix): $($files.Name -join ', ')"
            }
            Write-Host ("win-x64{0}: {1:N2} MB" -f $variant.Suffix, ($files[0].Length / 1MB))

            $zipName = "BeijingTimeOverlay-$tag-win-x64$($variant.Suffix).zip"
            $zipPath = ".\release\$zipName"
            Compress-Archive -LiteralPath $files[0].FullName -DestinationPath $zipPath -CompressionLevel Optimal

            $hash = (Get-FileHash $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
            [IO.File]::WriteAllText(".\release\$zipName.sha256", "$hash  $zipName`n", [Text.ASCIIEncoding]::new())
            $assets += "$zipName=$hash"
          }

          [IO.File]::AppendAllText($env:GITHUB_ENV, "RELEASE_ZIPS=$($assets -join ';')`n", [Text.UTF8Encoding]::new($false))

      - name: Create draft release and verify uploaded assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $zipHashes = @{}
          foreach ($entry in $env:RELEASE_ZIPS -split ';') {
            $parts = $entry -split '=', 2
            $zipHashes[$parts[0]] = $parts[1]
          }

          $uploadPaths = @()
          foreach ($zipName in $zipHashes.Keys) {
            $uploadPaths += ".\release\$zipName", ".\release\$zipName.sha256"
          }

          gh release create $tag @uploadPaths --verify-tag --draft --title "北京时间浮窗 $tag（Windows x64）" --notes-file $env:RELEASE_NOTES_PATH
          if ($LASTEXITCODE -ne 0) { throw 'Failed to create draft GitHub release or upload assets' }

          $assetLines = gh release view $tag --json assets --jq '.assets[] | [.name, .digest] | @tsv'
          if ($LASTEXITCODE -ne 0) { throw 'Failed to inspect uploaded release assets' }
          $assetDigests = @{}
          foreach ($line in $assetLines) {
            $parts = $line -split "`t", 2
            if ($parts.Count -eq 2) { $assetDigests[$parts[0]] = $parts[1] }
          }

          foreach ($zipName in $zipHashes.Keys) {
            foreach ($name in @($zipName, "$zipName.sha256")) {
              if (-not $assetDigests.ContainsKey($name)) {
                throw "Release is missing asset $name"
              }
            }

            if ($assetDigests[$zipName] -and $assetDigests[$zipName] -ne "sha256:$($zipHashes[$zipName])") {
              throw "GitHub-reported digest of $zipName does not match the locally computed SHA-256"
            }
          }

          gh release edit $tag --verify-tag --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Failed to publish the verified draft release' }
